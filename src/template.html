.tlist .tr{cursor:pointer}.tlist .tr.on{background:var(--chip);box-shadow:-10px 0 0 var(--chip),10px 0 0 var(--chip)}

/* ===== design system, after the CityCentre and Galleria pages ===== */
:root{--f:Inter,system-ui,-apple-system,sans-serif;--m:Inter,system-ui,-apple-system,sans-serif;--card:#fffdf9;--sh1:0 6px 22px rgba(43,36,32,.08);--sh2:0 10px 30px rgba(43,36,32,.16)}

#hdr .sub{font:400 12px var(--f);letter-spacing:0;margin-top:2px;color:var(--mute)}

.chip{border-radius:6px;font:600 12px var(--f);background:var(--card);border-color:var(--rule);height:34px}.chip.on{background:var(--ink);color:#fff}
#hy{padding:0 3px 0 3px}#hyP{background:var(--ink);color:#fff}#hyY{font:700 14px var(--f);letter-spacing:-.01em}
#compass,#home{background:var(--card)!important;border:1px solid var(--rule)!important;box-shadow:var(--sh1)}#compass::before{border-color:var(--rule)}
#zctl{border-radius:20px;background:var(--card);border-color:var(--rule);box-shadow:var(--sh1);padding:3px}#zctl button{border-radius:50%;font:500 17px var(--f)}#zctl button+button{border-top:0}
